buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
        // Facebook SDK for the app and react-native-fbsdk-next (which reads this name).
        // Pinned: "latest.release" / "18.+" changed silently between builds.
        facebookSdkVersion = "18.3.0"
    }
    repositories {
        
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath 'com.google.gms:google-services:4.4.2' 
        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.9'
         //compile project(':react-native-upi-payment')
    }
}

allprojects {
    repositories {
        // payu-non-seam-less-react pulls in PayU's PhonePe intent SDK, which is only published here.
        maven { url "https://phonepe.mycloudrepo.io/public/repositories/phonepe-intentsdk-android" }
    }
}

apply plugin: "com.facebook.react.rootproject"
